<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logowanie — NERAVIKO</title><link rel="stylesheet" href="assets/style.css"></head><body><header class="top"><a class="logo" href="index.html">NERAVIKO<span>.</span></a><nav><a href="index.html">Strona główna</a><a href="register.html">Rejestracja</a></nav></header><main class="wrap content"><p class="tag">WRÓĆ DO SWOJEGO ŚWIATA</p><h1>Logowanie</h1><form class="panel" id="form"><label class="field">E-mail<input name="email" type="email" required autocomplete="username"></label><label class="field">Hasło<input name="password" type="password" required autocomplete="current-password"></label><button class="button" type="submit">Zaloguj się</button><p id="msg" class="notice">Logowanie wymaga uruchomienia API i bazy danych na hostingu.</p></form></main><script>document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();try{const r=await fetch("/api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const j=await r.json();document.getElementById("msg").textContent=j.message||"Sprawdź odpowiedź serwera."}catch{document.getElementById("msg").textContent="API nie jest jeszcze podłączone. Skonfiguruj Pages Functions i D1."}})</script></body></html>
